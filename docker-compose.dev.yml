services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resenias
      POSTGRES_USER: resenias
      POSTGRES_PASSWORD: resenias123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resenias -d resenias"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    external: true
    name: reseaapp_pgdata
