app:
  frontend-url: http://localhost:8080

spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-not-real}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-not-real}
            scope: openid,email,profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:placeholder-not-real}
            client-secret: ${FACEBOOK_CLIENT_SECRET:placeholder-not-real}
            scope: email,public_profile
