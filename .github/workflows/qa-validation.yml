name: QA Validation

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - qa

jobs:
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resena
          POSTGRES_PASSWORD: resena123
          POSTGRES_DB: resena_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Smoke Tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/resena_db
          SPRING_DATASOURCE_USERNAME: resena
          SPRING_DATASOURCE_PASSWORD: resena123
          SPRING_PROFILES_ACTIVE: test
        run: |
          cd backend
          mvn test -Dtest="*SmokeTest" -DfailIfNoTests=false

      - name: Post Test Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.existsSync('backend/target/surefire-reports')
              ? 'Tests executed' 
              : 'No test data';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## QA Validation Results\n✅ Smoke tests completed\n📊 ${testResults}`
            });
