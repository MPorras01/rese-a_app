name: Deploy to Dokploy

on:
  pull_request:
    types: [closed]
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy to Dokploy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master')

    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}
      url: ${{ secrets.DOKPLOY_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Version
        id: version
        run: |
          VERSION=$(git describe --tags --always)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Deploy via Dokploy API
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "appId": "${{ secrets.DOKPLOY_APP_ID }}",
              "gitBranch": "master",
              "gitCommit": "${{ github.sha }}",
              "version": "${{ steps.version.outputs.version }}"
            }' \
            "${{ secrets.DOKPLOY_WEBHOOK_URL }}"

      - name: Verify Deployment
        run: |
          echo "Deployment initiated to Dokploy"
          echo "Monitor progress at: ${{ secrets.DOKPLOY_URL }}"

      - name: Create Deployment Record
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: '${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'production' }}',
              description: 'Deployment to Dokploy - v${{ steps.version.outputs.version }}'
            });
