services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reseniaapp
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Base de datos — RDS endpoint
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      OTP_JWT_SECRET: ${OTP_JWT_SECRET}
      # OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder-not-real}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder-not-real}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-placeholder-not-real}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-placeholder-not-real}
      # App
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
      # JVM — optimizado para t2.micro (1 GB RAM)
      JAVA_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxRAMPercentage=70.0
        -XX:+UseContainerSupport
        -Djava.awt.headless=true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
